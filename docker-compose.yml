services:
  # 1. PostgreSQL local
  local-db:
    image: postgres:15
    container_name: local_postgres_db
    restart: always
    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: TajneHaslo123
      POSTGRES_DB: local_app_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. DynamoDB local
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: local_dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"

  # 3. LocalStack- SQS, EventBridge, Lambda, S3
  localstack:
    image: localstack/localstack:3
    container_name: local_aws_cloud
    ports:
      - "4566:4566"
    environment:
      - DEFAULT_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  postgres_data:
